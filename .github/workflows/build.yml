name: Build Image

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - "feature/DEPLOYMENT_26.7"
    tags:
      - "v*"

env:
  PKR_VAR_MIRROR: https://mirror.init7.net/opnsense
  PKR_VAR_VERSION: 26.7

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable package documentation
        run: |
          mkdir -p /etc/dpkg/dpkg.cfg.d

          sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
          path-exclude /usr/share/doc/*
          path-exclude /usr/share/man/*
          path-exclude /usr/share/info/*
          EOF

      - name: Set up QEMU
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            bridge-utils \
            bzip2 \
            openssl

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3

      - name: Cache OPNsense ISO
        uses: actions/cache@v4
        id: cache-iso
        with:
          path: iso
          key: iso-${{ env.PKR_VAR_VERSION }}

      - name: Download and verify OPNsense ISO
        run: |
          chmod +x get-iso.sh
          ./get-iso.sh

      - name: Read generated ISO SHA1
        run: |
          ISO_NAME="OPNsense-${PKR_VAR_VERSION}-dvd-amd64.iso"
          SHA1_FILE="iso/${ISO_NAME}.sha1"

          test -f "${SHA1_FILE}"

          ISO_SHA1="$(awk '{print $1}' "${SHA1_FILE}")"

          if [ -z "${ISO_SHA1}" ]; then
            echo "ERROR: Could not read ISO SHA1."
            exit 1
          fi

          echo "ISO SHA1: ${ISO_SHA1}"

          echo \
            "PKR_VAR_ISO_CHECKSUM=sha1:${ISO_SHA1}" \
            >> "${GITHUB_ENV}"

      - name: Verify generated ISO SHA1
        run: |
          ISO_NAME="OPNsense-${PKR_VAR_VERSION}-dvd-amd64.iso"

          (
            cd iso
            sha1sum --check \
              "${ISO_NAME}.sha1"
          )

      - name: Initialize Packer
        run: |
          packer init .

      - name: Validate Packer configuration
        run: |
          packer validate .

      - name: Build OPNsense image
        env:
          PACKER_LOG: 1
        run: |
          packer build .

      - name: Verify generated image
        run: |
          echo "=== Workspace ==="
          pwd

          echo
          echo "=== Files ==="
          find . -maxdepth 3 -type f -print | sort

          echo
          echo "=== Output directory ==="
          if [ -d output ]; then
            ls -lah output
          else
            echo "output directory does not exist"
          fi

          echo
          echo "=== API key ==="
          if [ -f apikey.txt ]; then
            echo "apikey.txt exists"
            ls -l apikey.txt
          else
            echo "apikey.txt does not exist"
          fi

          echo
          echo "=== QCOW2 candidates ==="
          find . -type f \( -name '*.qcow2' -o -name '*apikey*' \) -print

      - name: Verify generated QCOW2
        run: |
          test -f output/opnsense-${PKR_VAR_VERSION}.qcow2
          test -f apikey.txt

          qemu-img info output/opnsense-${PKR_VAR_VERSION}.qcow2

      - name: Prepare release image
        run: |
          cp \
            "output/opnsense-${PKR_VAR_VERSION}.qcow2" \
            "output/opnsense.qcow2"

      - name: Calculate QCOW2 SHA1
        run: |
          (
            cd output
            sha1sum opnsense.qcow2 > opnsense.qcow2.sha1sum
          )

      - name: Verify QCOW2 SHA1
        run: |
          (
            cd output
            sha1sum --check opnsense.qcow2.sha1sum
          )

      - name: Prepare release artifact
        run: |
          mkdir -p release

          cp \
            apikey.txt \
            release/apikey.txt

          cp \
            output/opnsense.qcow2 \
            release/opnsense.qcow2

          cp \
            output/opnsense.qcow2.sha1sum \
            release/opnsense.qcow2.sha1sum

          echo "Release files:"
          find release \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: opnsense-image
          path: release/

  upload-image:
    runs-on: ubuntu-latest

    needs:
      - build-image

    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: opnsense-image
          path: release

      - name: Verify release files
        run: |
          test -f release/apikey.txt
          test -f release/opnsense.qcow2
          test -f release/opnsense.qcow2.sha1sum

      - name: Verify QCOW2 SHA1
        run: |
          sha1sum --check \
            release/opnsense.qcow2.sha1sum

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/apikey.txt
            release/opnsense.qcow2
            release/opnsense.qcow2.sha1sum

          body: |
            OPNsense test image built from this repository.

            OPNsense version:
            ${{ env.PKR_VAR_VERSION }}

            Release artifacts:

            - apikey.txt
            - opnsense.qcow2
            - opnsense.qcow2.sha1sum

            The image was built using the Packer configuration
            contained in this repository.

            The source OPNsense installer was verified using:
            - official OPNsense SHA256 checksum
            - official OPNsense OpenSSL image signature

            The generated QCOW2 image is accompanied by a SHA1 checksum.
